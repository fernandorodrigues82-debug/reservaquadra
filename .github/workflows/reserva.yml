name: Reserva Automática de Quadra

on:
  # Agendado: 21:00 UTC = 18:00 de Brasília (UTC-3).
  # Disparamos BEM mais cedo que a meia-noite de propósito: o GitHub Actions
  # pode atrasar o disparo do cron por HORAS em horários de pico (o pico
  # mais forte é logo na virada do dia em UTC, 00:00-01:00 UTC — perto da
  # meia-noite de Brasília). Disparando às 18:00 (longe desse pico), sobra
  # bastante margem mesmo com atraso grande. O script gh_runner.py dorme
  # sozinho (sem abrir navegador) até perto da meia-noite de verdade, e só
  # aí loga e dispara as reservas.
  schedule:
    - cron: '0 21 * * *'

  # Permite disparar manualmente pelo botão "Run workflow" na aba Actions
  # (útil para testar sem esperar a meia-noite).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reservar:
    runs-on: ubuntu-latest
    # Precisa cobrir do disparo (18:00) até pouco depois da meia-noite
    # (~6h10min), mas o limite MÁXIMO de um job no GitHub Actions é 6h
    # (360 min) — não dá pra passar disso. Deixamos folga dentro desse teto.
    timeout-minutes: 355

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r requirements-bot.txt
          playwright install --with-deps chromium

      - name: Executar o robô de reserva
        env:
          TOWNSQ_EMAIL: ${{ secrets.TOWNSQ_EMAIL }}
          TOWNSQ_SENHA: ${{ secrets.TOWNSQ_SENHA }}
          TOWNSQ_LOGIN_URL: ${{ secrets.TOWNSQ_LOGIN_URL }}
          HEADLESS: 'True'
        run: python scheduler/gh_runner.py

      - name: Salvar status atualizado das reservas (se houve mudança)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reservations.json
          git commit -m "Atualiza status de reservas apos execucao (run ${{ github.run_id }})" || echo "nada para commitar"
          git push || echo "nada para enviar"
